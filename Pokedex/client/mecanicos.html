<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taller de Motos - Mecánicos</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-logo">
    <img src="logo.ico" alt="Logo" class="logo-ico">
    <h1>Taller de Motos</h1>
</div>

    <nav>
        <a href="index.html">Calcular Reparación</a>
        <a href="mecanicos.html" class="active">Mecánicos</a>
        <a href="repuestos.html">Repuestos</a>
        <a href="historial.html">Historial</a>
        <a href="ia.html">Asistente IA</a>
    </nav>

    <div class="card">
        <h2>Agregar Mecánico</h2>
        <div class="form-group">
            <input type="text" id="mec-name" placeholder="Nombre">
            
            <select id="mec-level">
                <option value="" disabled selected>Nivel (A, B, P)</option>
                <option value="A">Nivel A</option>
                <option value="B">Nivel B</option>
                <option value="P">Nivel P</option>
            </select>
            
            <input type="number" id="mec-price" placeholder="Precio por hora">
            <button onclick="agregarMecanico()">Agregar Mecánico</button>
        </div>
    </div>

    <div class="card">
        <h2>Mecánicos Registrados</h2>
        <ul id="lista-mecanicos"></ul>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/mecanicos.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
